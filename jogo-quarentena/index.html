<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="manifest" href="manifest.json">

</head>
<body>
<!--GAME-START-->
<title>Zona de Quarentena</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=VT323&display=swap">
<style>
/* Layout: uma tela de posto de controle — HUD, cabine com o sobrevivente, mesa de exames, decisão */
:root {
  --bg: #171a16;
  --panel: #23281f;
  --panel-2: #2e3528;
  --line: #3d4634;
  --fg: #e9e5d3;
  --muted: #a3a48f;
  --accent: #e3a83b;
  --danger: #d4523f;
  --safe: #5cae67;
  --screen: #0f1a12;
  --screen-fg: #8fe39b;
  --f-display: "Chakra Petch", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Chakra Petch", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data: "VT323", ui-monospace, "Courier New", monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 15px;
  -webkit-tap-highlight-color: transparent; user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }

#app {
  max-width: 520px; margin: 0 auto; min-height: 100%;
  display: flex; flex-direction: column; gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}

.hud { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.hud-item {
  background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
  padding: 4px 6px; display: flex; flex-direction: column; min-width: 0;
}
.lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.val { font-family: var(--f-data); font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; }
.val.warn { color: var(--danger); }
.strikes { color: var(--danger); letter-spacing: 2px; }

.booth {
  display: grid; grid-template-columns: 150px 1fr; gap: 12px; align-items: start;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px;
}
.portrait-wrap { position: relative; width: 150px; aspect-ratio: 1; max-width: 100%; }
#cv { width: 100%; height: 100%; border-radius: 3px; transition: filter .4s; }
#cv.gone { filter: grayscale(1) brightness(.45); }
.stamp {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-12deg);
  font-family: var(--f-display); font-weight: 700; font-size: 19px; letter-spacing: .06em;
  padding: 3px 8px; border: 3px solid currentColor; border-radius: 3px;
  background: rgba(0,0,0,.35); animation: stamp .25s ease-out;
}
.stamp.ok { color: var(--safe); } .stamp.bad { color: var(--danger); }
@keyframes stamp { from { transform: translate(-50%, -50%) rotate(-12deg) scale(1.8); opacity: 0; } }
.ident { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.nome { font-family: var(--f-display); font-weight: 700; font-size: 18px; text-wrap: balance; }
.info { font-size: 12px; color: var(--muted); }
.fala {
  margin: 6px 0 0; padding: 8px 10px; background: var(--panel-2); border-radius: 4px;
  font-size: 14px; line-height: 1.35; position: relative;
}
.fala::before {
  content: ""; position: absolute; left: -6px; top: 12px;
  border: 6px solid transparent; border-left: 0; border-right-color: var(--panel-2);
}

.exam { display: grid; grid-template-columns: 1.25fr 1fr; gap: 10px; }
.exam-view {
  position: relative; background: var(--screen); border: 1px solid var(--line); border-radius: 6px;
  overflow: hidden; aspect-ratio: 64 / 40; max-width: 100%;
}
#ex { width: 100%; height: 100%; }
.ex-msg {
  position: absolute; inset: auto 0 0 0; padding: 3px 8px;
  font-family: var(--f-data); font-size: 20px; color: var(--screen-fg);
  background: linear-gradient(transparent, rgba(0,0,0,.65));
}
.ex-msg:empty { display: none; }
.scanbar { position: absolute; left: 0; right: 0; top: 0; height: 3px; }
.scanbar i { display: block; height: 100%; width: 0; background: var(--screen-fg); }
.ficha {
  list-style: none; margin: 0; padding: 8px; min-width: 0;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  display: flex; flex-direction: column; gap: 4px; font-size: 13px;
}
.ficha .tit { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.ficha li.row { display: flex; justify-content: space-between; gap: 6px; cursor: pointer; }
.ficha li.row b { font-family: var(--f-data); font-weight: 400; font-size: 18px; line-height: 1; }
.ficha .vazio { color: var(--muted); font-size: 12px; }

.tools { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.tool {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px;
  padding: 8px 2px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-size: 11px; min-width: 0;
}
.tool canvas { width: 28px; height: 28px; }
.tool:hover:not(:disabled) { border-color: var(--muted); }
.tool.on { border-color: var(--accent); }
.tool.done span::after { content: " ✓"; color: var(--safe); }
.tool:disabled { opacity: .35; cursor: default; }

.decide { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn {
  border: 0; border-radius: 6px; padding: 14px 10px;
  font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: .08em; text-transform: uppercase;
  box-shadow: inset 0 -4px 0 rgba(0,0,0,.28);
}
.btn:active { transform: translateY(2px); box-shadow: inset 0 -2px 0 rgba(0,0,0,.28); }
.btn.danger { background: var(--danger); color: #fff; }
.btn.safe { background: var(--safe); color: #0d1a0f; }
.btn.main { background: var(--accent); color: #1c1405; width: 100%; }
.btn:disabled { opacity: .45; }
.foot { display: flex; justify-content: space-between; }
.link { background: none; border: 0; color: var(--muted); font-size: 13px; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; }

.ov {
  position: fixed; inset: 0; background: rgba(8,10,7,.82); z-index: 20;
  display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
}
.card {
  width: 100%; max-width: 440px; max-height: 100%; overflow-y: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px;
  display: flex; flex-direction: column; gap: 12px; user-select: text;
}
.card h2 { margin: 0; font-family: var(--f-display); font-size: 26px; text-wrap: balance; }
.card h2.bad { color: var(--danger); }
.card p { margin: 0; line-height: 1.45; color: var(--fg); }
.card .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--accent); }
.rules { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.rules li { background: var(--panel-2); border-radius: 5px; padding: 8px 10px; font-size: 14px; line-height: 1.4; }
.rules li b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.rules li.novo { outline: 1px solid var(--accent); }
.rules li.novo b::after { content: "  novo"; color: var(--accent); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.stats div { background: var(--panel-2); border-radius: 5px; padding: 8px 10px; display: flex; flex-direction: column; }
.stats b { font-family: var(--f-data); font-size: 28px; font-weight: 400; line-height: 1; }
.stats span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

.toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  width: min(480px, calc(100% - 32px)); z-index: 15;
  background: var(--panel-2); border-left: 4px solid var(--accent); border-radius: 5px;
  padding: 10px 12px; font-size: 14px; line-height: 1.35; box-shadow: 0 6px 24px rgba(0,0,0,.5);
}
.toast.ok { border-left-color: var(--safe); } .toast.bad { border-left-color: var(--danger); }

@media (max-width: 400px) {
  .booth { grid-template-columns: 116px 1fr; }
  .portrait-wrap { width: 116px; }
  .exam { grid-template-columns: 1fr; }
  .val { font-size: 21px; }
}
@media (prefers-reduced-motion: reduce) { .stamp { animation: none; } #cv { transition: none; } }
</style>

<div id="app">
  <header class="hud">
    <div class="hud-item"><span class="lbl">Dia</span><span id="hDia" class="val">1</span></div>
    <div class="hud-item"><span class="lbl">Turno</span><span id="hTempo" class="val">0:00</span></div>
    <div class="hud-item"><span class="lbl">Fila</span><span id="hFila" class="val">0</span></div>
    <div class="hud-item"><span class="lbl">Pontos</span><span id="hPts" class="val">0</span></div>
    <div class="hud-item"><span class="lbl">Erros</span><span id="hErros" class="val strikes">□□□</span></div>
  </header>

  <section class="booth">
    <div class="portrait-wrap">
      <canvas id="cv" width="48" height="48"></canvas>
      <div id="stamp" class="stamp" hidden></div>
    </div>
    <div class="ident">
      <div id="pNome" class="nome">Posto 7 — Portão Leste</div>
      <div id="pInfo" class="info">Aguardando a fila</div>
      <p id="pFala" class="fala">Próximo!</p>
    </div>
  </section>

  <section class="exam">
    <div class="exam-view">
      <canvas id="ex" width="64" height="40"></canvas>
      <div id="exMsg" class="ex-msg"></div>
      <div class="scanbar"><i id="scan"></i></div>
    </div>
    <ul id="ficha" class="ficha"></ul>
  </section>

  <div id="tools" class="tools"></div>

  <div class="decide">
    <button id="bElim" class="btn danger" type="button">Eliminar</button>
    <button id="bSalv" class="btn safe" type="button">Salvar</button>
  </div>

  <footer class="foot">
    <button id="bManual" class="link" type="button">Manual do fiscal</button>
    <button id="bSom" class="link" type="button">Som: ligado</button>
  </footer>
</div>

<div id="ov" class="ov" hidden><div id="ovCard" class="card"></div></div>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const R = (a, b) => a + Math.random() * (b - a);
const RI = (a, b) => Math.floor(R(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const chance = p => Math.random() < p;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = RI(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmtT = v => v.toFixed(1).replace(".", ",") + " °C";

function rng(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const c = [n >> 16, n >> 8 & 255, n & 255].map(v => Math.round(f < 0 ? v * (1 + f) : v + (255 - v) * f));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

// ---------- Regras ----------
const TOOLS = [
  { id: "temp",    nome: "Termômetro", dia: 1, regra: "Febre de 38,0 °C ou mais é sinal de infecção. Até 37,9 °C pode passar." },
  { id: "olhos",   nome: "Lanterna",   dia: 1, regra: "Parte branca do olho amarelada, com pupila que não diminui na luz, é infecção. Olho vermelho de cansaço é normal." },
  { id: "bracos",  nome: "Braços",     dia: 2, regra: "Mordida (marca de dentes vermelha com roxo em volta) é infecção. Cicatriz clara e tatuagem são normais." },
  { id: "pulso",   nome: "Pulso",      dia: 3, regra: "Pulso abaixo de 50 bpm é infecção. Pulso acelerado é só nervosismo." },
  { id: "pescoco", nome: "Pescoço",    dia: 4, regra: "Veias escuras e arroxeadas subindo pelo pescoço são infecção. Colar e tatuagem são normais." },
];
const SIGN_TXT = {
  temp: p => `febre de ${fmtT(p.temp)}`,
  olhos: () => "olhos amarelados",
  bracos: () => "uma mordida no braço",
  pulso: p => `pulso de ${p.pulso} bpm`,
  pescoco: () => "veias escuras no pescoço",
};
const SCAN_T = 0.9;

// ---------- Pessoas ----------
const NOMES_F = ["Ana", "Bruna", "Carla", "Dandara", "Elisa", "Fernanda", "Graça", "Helena", "Iara", "Joana", "Kátia", "Luana", "Marta", "Neide", "Olívia", "Priscila", "Rita", "Sônia", "Tereza", "Vitória"];
const NOMES_M = ["André", "Bento", "Caio", "Davi", "Edson", "Fábio", "Gilberto", "Hugo", "Igor", "Jorge", "Luiz", "Márcio", "Nelson", "Otávio", "Paulo", "Raimundo", "Sérgio", "Tiago", "Valter", "Wesley"];
const SOBRENOMES = ["Silva", "Souza", "Oliveira", "Santos", "Lima", "Pereira", "Costa", "Rocha", "Almeida", "Barbosa", "Ferreira", "Nunes", "Moura", "Cardoso", "Teixeira", "Ramos"];
const OFICIOS = ["enfermeira", "pedreiro", "professora", "motorista", "cozinheiro", "estudante", "agricultora", "mecânico", "costureira", "vendedor", "eletricista", "aposentada"];
const ORIGENS = ["Setor Norte", "Vila Industrial", "Bairro do Porto", "Rodovia 116", "Centro antigo", "Zona rural", "Hospital Regional", "Estação de trem"];
const FALAS = [
  "Andei três dias até chegar aqui.", "Minha filha já passou pelo portão ontem.", "Pode examinar, não tenho nada.",
  "Faz dois dias que eu não como direito.", "Só quero dormir num lugar seguro.", "Eu era voluntário no abrigo antigo.",
  "Perdi meus documentos na estrada.", "Tô com frio, mas é a chuva.", "Por favor, seja rápido.",
  "Me escondi num mercado a semana toda.", "Eu vi o que acontece com quem fica lá fora.", "Tenho remédio de pressão, só isso.",
  "Vim com um grupo, mas me perdi deles.", "Juro que ninguém me tocou.", "Só arranhei o braço numa cerca.",
  "Meu coração tá disparado, desculpa.", "Não durmo há dias.", "Você vai me deixar entrar, né?",
];
const PELES = ["#f1c9a5", "#e0ac83", "#c68a5e", "#a8693f", "#7d4a2a", "#5c3420"];
const CABELOS = ["#1d1611", "#3b2416", "#6a4423", "#a0743b", "#c9b48a", "#8d8b86"];
const ROUPAS = ["#4f6d7a", "#7a4f4f", "#5b7a4f", "#6b5b7a", "#8a7a4a", "#3d4a5c", "#9a5b3a", "#4a5a4a"];
const IRIS = ["#5a3a1e", "#3a6a8a", "#4a7a4a", "#2a1a10", "#7a6a3a"];
const ESTILOS = ["curto", "longo", "careca", "bone", "cacheado", "coque"];

function makePerson(day) {
  const unlocked = TOOLS.filter(t => t.dia <= day).map(t => t.id);
  const infected = chance(Math.min(0.38 + day * 0.02, 0.5));
  let signs = [];
  if (infected) {
    const n = day <= 2 ? RI(1, 2) : (chance(day >= 6 ? 0.85 : 0.65) ? 1 : 2);
    signs = shuffle(unlocked.slice()).slice(0, Math.min(n, unlocked.length));
  }
  const has = id => signs.includes(id);
  const dist = () => day >= 2 && chance(Math.min(0.12 + day * 0.06, 0.45));
  const fem = chance(0.5);
  const idade = RI(17, 74);
  const p = {
    seed: RI(1, 1e9), infected, signs, fem, idade,
    nome: `${pick(fem ? NOMES_F : NOMES_M)} ${pick(SOBRENOMES)}`,
    oficio: idade > 64 ? (fem ? "aposentada" : "aposentado") : pick(OFICIOS),
    origem: pick(ORIGENS), fala: pick(FALAS),
    pele: pick(PELES), cabelo: idade > 60 && chance(.6) ? "#b9b6ae" : pick(CABELOS),
    roupa: pick(ROUPAS), iris: pick(IRIS),
    estilo: fem ? pick(["longo", "coque", "cacheado", "curto", "bone"]) : pick(ESTILOS),
    barba: !fem && chance(.35), oculos: chance(.18),
  };
  p.temp = has("temp") ? R(38.2, 40.2) : dist() ? R(37.6, 37.9) : R(36.0, 37.4);
  p.olhos = has("olhos") ? "amarelo" : dist() ? "vermelho" : "normal";
  p.bracos = has("bracos") ? "mordida" : dist() ? pick(["cicatriz", "tatuagem"]) : "limpo";
  p.pulso = has("pulso") ? RI(28, 46) : dist() ? RI(112, 128) : RI(62, 98);
  p.pescoco = has("pescoco") ? "veias" : dist() ? pick(["colar", "tatuagem"]) : "limpo";
  return p;
}

// ---------- Desenho ----------
function painter(ctx) {
  return (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); };
}
function disc(px, cx, cy, r, c, inside) {
  for (let y = Math.floor(cy - r); y <= cy + r; y++)
    for (let x = Math.floor(cx - r); x <= cx + r; x++)
      if ((x + .5 - cx) ** 2 + (y + .5 - cy) ** 2 <= r * r && (!inside || inside(x, y))) px(x, y, 1, 1, c);
}

const cv = $("#cv"), cx = cv.getContext("2d"), P = painter(cx);
function drawPortrait(p, t) {
  P(0, 0, 48, 48, "#2b3127");
  for (let y = 4; y < 48; y += 6) P(0, y, 48, 1, "#343b2f");
  for (let y = 4; y < 48; y += 12) P(0, y, 4, 1, "#596349");
  if (!p) {
    P(16, 14, 16, 22, "#22281f"); P(10, 34, 28, 14, "#22281f");
    return;
  }
  const bob = Math.sin(t * 2 + p.seed) > .6 ? 1 : 0;
  const sk = p.pele, skD = shade(sk, -.18), hair = p.cabelo;
  const o = bob;
  // corpo
  P(8, 38 + o, 32, 10, p.roupa); P(7, 40 + o, 34, 8, p.roupa);
  P(8, 38 + o, 32, 1, shade(p.roupa, .15));
  P(20, 31 + o, 8, 8, skD); P(21, 38 + o, 6, 2, skD);
  // cabeça
  if (p.estilo === "longo") P(13, 12 + o, 22, 20, hair);
  P(16, 10 + o, 16, 1, sk); P(15, 11 + o, 18, 20, sk); P(16, 31 + o, 16, 1, sk);
  P(30, 12 + o, 3, 19, skD); P(14, 19 + o, 1, 4, skD); P(33, 19 + o, 1, 4, skD);
  // cabelo
  const H = (x, y, w, h) => P(x, y + o, w, h, hair);
  switch (p.estilo) {
    case "curto": H(15, 8, 18, 4); H(15, 12, 2, 5); H(31, 12, 2, 5); break;
    case "longo": H(14, 7, 20, 5); H(14, 12, 3, 8); H(31, 12, 3, 8); break;
    case "cacheado": H(12, 4, 24, 9); H(12, 12, 4, 10); H(32, 12, 4, 10);
      for (let i = 0; i < 6; i++) P(13 + i * 4, 4 + o, 2, 1, shade(hair, .12)); break;
    case "coque": H(15, 8, 18, 4); H(21, 4, 6, 4); H(15, 12, 2, 3); H(31, 12, 2, 3); break;
    case "bone": { const c = shade(p.roupa, -.25);
      P(14, 7 + o, 20, 5, c); P(14, 12 + o, 22, 2, shade(c, -.2)); H(15, 14, 2, 3); H(31, 14, 2, 3); break; }
    case "careca": P(18, 12 + o, 3, 1, shade(sk, .18)); break;
  }
  // rosto
  P(18, 18 + o, 4, 1, shade(hair, -.2)); P(26, 18 + o, 4, 1, shade(hair, -.2));
  const blink = (t * 1.3 + p.seed % 7) % 4 < .12;
  if (blink) { P(18, 21 + o, 4, 1, skD); P(26, 21 + o, 4, 1, skD); }
  else {
    P(18, 20 + o, 4, 2, "#efeadc"); P(26, 20 + o, 4, 2, "#efeadc");
    P(20, 20 + o, 2, 2, p.iris); P(28, 20 + o, 2, 2, p.iris);
    P(20, 21 + o, 1, 1, "#111"); P(28, 21 + o, 1, 1, "#111");
  }
  if (p.oculos) {
    const g = "#20201c"; P(17, 19 + o, 6, 1, g); P(25, 19 + o, 6, 1, g); P(17, 22 + o, 6, 1, g); P(25, 22 + o, 6, 1, g);
    P(17, 19 + o, 1, 4, g); P(22, 19 + o, 1, 4, g); P(25, 19 + o, 1, 4, g); P(30, 19 + o, 1, 4, g); P(23, 20 + o, 2, 1, g);
  }
  P(24, 22 + o, 1, 3, skD); P(23, 25 + o, 3, 1, skD);

let actx = null;

  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), n = actx.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, n);

  } catch (e) {}

  const msg = S.scan ? "Examinando…" : !S.view ? (S.cur ? "Escolha um exame" : "") :
    S.view === "temp" ? fmtT(S.cur.temp) : S.view === "pulso" ? `${S.cur.pulso} bpm` :
    S.view === "olhos" ? "Olho sob a lanterna" : S.view === "bracos" ? "Antebraço" : "Pescoço";
  if (msg !== S.last) { $("#exMsg").textContent = msg; S.last = msg; }
  if (S.phase === "play" || S.phase === "scan") { $("#hTempo").textContent = fmtTime(S.time); $("#hTempo").classList.toggle("warn", S.time < 15); }
  requestAnimationFrame(loop);
}
renderTools(); renderFicha(); renderHUD();
startGame();
requestAnimationFrame(loop);
})();
</script>
